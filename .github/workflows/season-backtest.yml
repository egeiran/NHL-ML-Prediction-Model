name: Season Backtest (2026)

# Walk-forward backtest mot faktiske resultater fra NHL-APIet. Skriptet trener
# selv en modell på sesongene før backtest-sesongen, så ingenting lekker inn.
# Resultatene legges i job-sammendraget. game.csv endres ikke.

on:
  push:
    branches:
      - "claude/**"
    paths:
      - "NHL/backtest_season.py"
      - ".github/workflows/season-backtest.yml"
  workflow_dispatch:
    inputs:
      season:
        description: "NHL season id"
        default: "20252026"
      eval_start:
        description: "Evaluate games from this date (YYYY-MM-DD)"
        default: "2026-01-01"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    env:
      REQUIREMENTS_FILE: NHL/requirements-api.txt
      NHL_BACKTEST_SEASON: ${{ github.event.inputs.season || '20252026' }}
      NHL_BACKTEST_EVAL_START: ${{ github.event.inputs.eval_start || '2026-01-01' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r "$REQUIREMENTS_FILE"

      - name: Run season backtest
        working-directory: NHL
        run: |
          set -o pipefail
          python backtest_season.py | tee /tmp/backtest.txt

      - name: Publish backtest to job summary
        if: always()
        run: |
          {
            echo "## NHL 2026 Season Backtest"
            echo ""
            echo "Season: \`${NHL_BACKTEST_SEASON}\` | Eval from: \`${NHL_BACKTEST_EVAL_START}\`"
            echo ""
            echo '```'
            cat /tmp/backtest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: season-backtest-report
          path: NHL/backtest_result.json
          if-no-files-found: warn
          retention-days: 30
