name: Daily Bet Update

on:
  schedule:
    - cron: "0 8 * * *"  # 08:00 UTC ~= 10:00 norsk tid (CET/CEST)
  workflow_dispatch:

permissions:
  contents: write  # trengs for å pushe bet_history.csv

jobs:
  update-bets:
    runs-on: ubuntu-latest
    concurrency:
      group: daily-bet-update
      cancel-in-progress: false
    env:
      REQUIREMENTS_FILE: NHL/requirements-api.txt
      PREDICTIONS_SCRIPT: NHL/generate_predictions.py
      EXTRA_PYPI_PACKAGES: "matplotlib tabulate"
      NHL_VALUE_MIN: "0.15"
      NHL_MAX_ODDS: "4.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r "$REQUIREMENTS_FILE"
          pip install $EXTRA_PYPI_PACKAGES

      - name: Download latest model artifact (best effort)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bumpet navn: det gamle "nhl-model"-artefaktet ble trent uten
          # Elo-features (14 kolonner) og er inkompatibelt med dagens 18-kolonners
          # pipeline. Nytt navn tvinger en fersk trening med Elo på første kjøring.
          ARTIFACT_NAME: nhl-model-elo
        run: |
          set -euo pipefail
          mkdir -p NHL/models
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100"
          response=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "$api" || true)
          if [ -z "$response" ]; then
            echo "No response from artifact API, will train if needed."
            exit 0
          fi
          url=$(python - <<'PY'
          import os, sys, json
          data_str = sys.stdin.read().strip()
          if not data_str:
              sys.exit(0)
          try:
              data = json.loads(data_str)
          except Exception:
              sys.exit(0)
          target = os.environ.get("ARTIFACT_NAME", "nhl-model")
          for art in data.get("artifacts", []):
              if art.get("name") == target and not art.get("expired"):
                  print(art.get("archive_download_url", ""))
                  break
          PY
          )
          if [ -z "$url" ]; then
            echo "No model artifact found, will train if needed."
            exit 0
          fi
          echo "Downloading model artifact: $ARTIFACT_NAME"
          curl -L -H "Authorization: Bearer $GH_TOKEN" -o /tmp/model.zip "$url"
          unzip -o /tmp/model.zip -d NHL/models

      - name: Ensure model artifact
        working-directory: NHL
        run: |
          # Krev BÅDE modell og Elo-ratings. Mangler én av dem, tren på nytt
          # slik at de er i sync (modellen forventer Elo-features).
          if [ -f models/nhl_model.pkl ] && [ -f models/elo_ratings.json ]; then
            echo "Existing model + Elo ratings found"
          else
            echo "Model or Elo ratings missing, training a fresh one..."
            python train_model.py
          fi

      - name: Update Elo ratings from NHL API
        working-directory: NHL
        run: |
          # Ruller Elo framover med faktiske resultater siden 2020 slik at
          # ratingene er ferske for dagens kamper. Feiler ikke jobben hvis
          # APIet er nede – da beholdes forrige fil.
          python update_elo_ratings.py || echo "[WARN] Elo-oppdatering feilet, beholder eksisterende ratings."

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: nhl-model-elo
          path: |
            NHL/models/nhl_model.pkl
            NHL/models/elo_ratings.json
          if-no-files-found: error
          retention-days: 30

      - name: Run daily bet update
        working-directory: NHL
        run: |
          python bet_tracker.py

      - name: Generate daily predictions assets
        env:
          MPLCONFIGDIR: /tmp/mplcache
        run: |
          python "$PREDICTIONS_SCRIPT"

      - name: Generate Elo ratings chart
        working-directory: NHL
        env:
          MPLCONFIGDIR: /tmp/mplcache
        run: |
          python generate_elo_chart.py

      - name: Run export tests
        id: export_tests
        working-directory: NHL
        # Feilende tester skal stoppe eksporten, men ikke hindre at dagens
        # bet-historikk og Elo-ratings blir committet.
        continue-on-error: true
        run: |
          if ! python test_site_export.py; then
            {
              echo "> [!WARNING]"
              echo "> Eksporttestene feilet – site-dataen ble ikke oppdatert."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Export static site data
        if: steps.export_tests.outcome == 'success'
        working-directory: NHL
        env:
          NHL_EXPORT_DAYS: "3"
        run: |
          # Frontend deployes statisk (Vercel) og leser disse JSON-filene i
          # stedet for å kalle FastAPI-et. Feiler ikke jobben hvis eksporten
          # ryker – da beholdes forrige JSON og resten av dagens data commites.
          python export_site_data.py || echo "[WARN] Eksport av site-data feilet, beholder eksisterende JSON."

      - name: Commit and push changes
        run: |
          # Sjekken på staged endringer under fanger både endrede og nye filer
          # (site-dataen er utracket første gang den genereres).
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add NHL/data/bet_history.csv NHL/data/bet_below_threshold.csv NHL/data/bet_shadow.csv NHL/models/elo_ratings.json docs/predictions.png docs/TODAY.md docs/portfolio.png docs/daily_profit.png docs/elo.png nhl-frontend/public/data/*.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: daily bet + predictions update"
          git push
