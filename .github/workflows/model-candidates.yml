name: Model Candidates

# Full walk-forward-sammenligning av modellkandidatene (evaluate_models.py):
# game.csv + NHL-APIet, Elo-tuning og MoneyPuck-features (xG, skudd, GSAx).
# Skriver docs/model_eval.md. Tung (~3 min + 128 MB nedlasting), derfor
# månedlig og på forespørsel – ikke på hver push.
#
# MoneyPuck-data er fri for ikke-kommersiell bruk med kreditering
# (https://moneypuck.com/data.htm). Fila caches per uke, så manuelle
# kjøringer samme uke ikke laster ned på nytt.

on:
  schedule:
    - cron: "0 10 1 * *"  # den 1. hver måned
  workflow_dispatch:

permissions:
  contents: write

jobs:
  candidates:
    runs-on: ubuntu-latest
    concurrency:
      group: bet-ledger
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: NHL/requirements-api.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r NHL/requirements-api.txt

      - name: Week key
        id: week
        run: echo "key=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache MoneyPuck data
        uses: actions/cache@v4
        with:
          path: /tmp/moneypuck
          key: moneypuck-${{ steps.week.outputs.key }}

      - name: Download MoneyPuck team game data
        run: |
          mkdir -p /tmp/moneypuck
          if [ ! -s /tmp/moneypuck/all_teams.csv ]; then
            curl -sSfL --max-filesize 400000000 -o /tmp/moneypuck/all_teams.csv \
              "https://moneypuck.com/moneypuck/playerData/careers/gameByGame/all_teams.csv" \
              || { echo "::warning::MoneyPuck utilgjengelig – kjører uten M5."; rm -f /tmp/moneypuck/all_teams.csv; }
          fi

      - name: Evaluate model candidates
        working-directory: NHL
        run: |
          if [ -s /tmp/moneypuck/all_teams.csv ]; then
            python evaluate_models.py --with-api --moneypuck /tmp/moneypuck/all_teams.csv
          else
            python evaluate_models.py --with-api
          fi

      - name: Commit report
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/model_eval.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: månedlig modellevaluering"
          git pull --rebase --autostash
          git push
