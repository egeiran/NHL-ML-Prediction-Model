name: Re-predict Season

# Re-predikerer sesongens loggede kamper uten preseason-kamper i formen, og
# med den nye modellen (se NHL/repredict_season.py). Trenger NHL-APIet og
# full git-historikk (Elo-fila hentes fra commiten som la inn hver rad).
# Rapporten committes tilbake til branchen jobben kjører på. Loggene endres ikke.

on:
  push:
    branches:
      - "claude/**"
    paths:
      - "NHL/repredict_season.py"
      - ".github/workflows/repredict-season.yml"
  workflow_dispatch:
    inputs:
      season:
        description: "Sesong i loggformat (f.eks. 2026-27). Tom = inneværende."
        default: ""

permissions:
  contents: write  # rapporten committes tilbake til branchen

concurrency:
  group: repredict-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repredict:
    runs-on: ubuntu-latest
    env:
      REQUIREMENTS_FILE: NHL/requirements-api.txt
      NHL_REPREDICT_SEASON: ${{ github.event.inputs.season || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r "$REQUIREMENTS_FILE"

      - name: Re-predict season
        working-directory: NHL
        run: |
          set -o pipefail
          python repredict_season.py | tee /tmp/repredict.txt

      - name: Publish report to job summary
        if: always()
        run: |
          report=$(ls docs/repredict_*.md 2>/dev/null | head -n 1 || true)
          if [ -n "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Ingen rapport skrevet – se loggen." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/repredict_*.md NHL/data/repredict_*.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: re-prediksjon av sesongen uten preseason"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
